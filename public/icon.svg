<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#0a0908" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f5e3b3" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#b88e28" />
      <stop offset="100%" stop-color="#f3dfa5" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf91" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#554010" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.9" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury rounded square badge -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  
  <!-- Outer metallic border -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner subtle hairline -->
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#d4af37" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Center Serif E -->
  <text 
    x="244" 
    y="352" 
    font-family="Playfair Display, 'Times New Roman', 'Cinzel', Didot, Georgia, serif" 
    font-size="330" 
    font-weight="bold" 
    text-anchor="middle" 
    fill="url(#goldGrad)" 
    filter="url(#goldGlow)"
  >E</text>
  
  <!-- Haute Parfumerie diamond sparkle -->
  <path d="M380 138 Q392 150 404 168 Q392 186 380 198 Q368 186 356 168 Q368 150 380 138 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>